name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap, no services, catches the mistake that actually happens most: a typo
  # in a file nobody opened during the change.
  lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'   # the declared minimum, not the newest
          coverage: none

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null || { echo "::error file=$file::syntax error"; status=1; }
          done < <(find serve-standalone tools tests -name '*.php')
          exit $status

  # No database: the assessment's modules are pure functions over their
  # arguments, so this runs in seconds and gates every PR cheaply.
  assessment:
    name: Assessment JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # the oldest Node that parses these modules unaided

      - name: Parse every assessment module
        run: |
          status=0
          # app.js is never imported by the tests — it needs a DOM — so without
          # this a syntax error in the file the visitor actually loads would
          # ship with a green build.
          for file in serve-standalone/public/assessment/*.js \
                      serve-standalone/public/admin/js/*.js; do
            node --check "$file" || { echo "::error file=$file::syntax error"; status=1; }
          done
          exit $status

      - name: Run the assessment tests
        run: node tools/run-js-tests.mjs

  # The arithmetic half of matching — taxonomy, crosswalk, tier contract —
  # needs no database, so it is worth running separately from the suite that
  # does: it fails in seconds rather than after MySQL has come up.
  unit:
    name: Matching unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run the unit tests
        run: php tools/run-unit-tests.php

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The suite in tests/ is the one the application was built against. It runs
    # with no WordPress installed at all, which is also the point: if anything
    # in serve-standalone/ reaches for a WordPress function that the
    # compatibility layer does not provide, this is where it is found.
    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: serve_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Configure
        working-directory: serve-standalone
        run: |
          cp config/config.example.php config/config.php
          SECRET=$(php bin/serve secret)
          sed -i "s|'change-me'|'${SECRET}'|" config/config.php
          sed -i "s|'name'    => 'serve'|'name'    => 'serve_test'|" config/config.php
          sed -i "s|'user'    => 'serve'|'user'    => 'root'|" config/config.php
          sed -i "s|'pass'    => ''|'pass'    => 'root'|" config/config.php
          sed -i "s|'host'    => '127.0.0.1'|'host'    => '127.0.0.1'|" config/config.php

      - name: Migrate
        working-directory: serve-standalone
        run: php bin/serve migrate

      - name: Run the suite
        working-directory: serve-standalone
        env:
          SERVE_TEST_OK: '1'
        run: php tools/run-tests.php

      - name: The command line answers
        working-directory: serve-standalone
        run: |
          php bin/serve status
          php bin/serve cron:list
