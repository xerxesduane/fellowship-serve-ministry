# WordPress lives in /var/www/html/serve, and the document root is its parent,
# so the site answers at http://localhost/serve with no rewriting in front of
# it. A reverse proxy stripping the prefix would have meant WordPress
# generating one set of URLs and Apache serving another; a real subdirectory
# install has no such disagreement, and matches how the plugin would sit under
# a path on a shared host.
<VirtualHost *:80>
	DocumentRoot /var/www/html

	# The document root itself holds nothing but the serve/ directory. Listing
	# it would only ever expose the install's layout.
	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		Require all granted
	</Directory>

	# Pretty permalinks are WordPress's own .htaccess, which it writes with the
	# right RewriteBase for a subdirectory install.
	<Directory /var/www/html/serve>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Anyone who types the bare host lands on the assessment rather than a 404.
	RedirectMatch ^/$ /serve/

	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined
</VirtualHost>
